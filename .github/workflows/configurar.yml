name: Configurar repositorio
on:
  push:
    paths:
      - 'plugins.template.json'
      - 'scripts/**'
      - '.github/workflows/configurar.yml'
      - 'builds/*.cs3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar links
        run: python3 scripts/configure.py
      - name: Salvar configuracao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json builds/plugins.json LINK_DO_REPOSITORIO.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Configura links do repositorio CloudStream'
            git push
          fi
